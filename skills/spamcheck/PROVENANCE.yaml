origin: original
author: Ryan Ilano
note: >-
  Bundles scripts/spamcheck.py, an unsubscribe-compliance auditor. Portable
  (macOS/Linux/WSL), Python 3 standard library only, no external dependencies.
  Reads a saved or pasted message; never connects to a mailbox and never sends
  anything. Network access is limited to HEAD/GET probes of unsubscribe URLs the
  message itself supplied, and only under --probe. Text messages (--sms) get no
  network access at all: links in a text are listed and assessed, never opened.
  Legal references for email (references/complaints.md, read 2026-09-20) and for
  texts (references/texts.md, read 2026-09-23) quote primary sources.
