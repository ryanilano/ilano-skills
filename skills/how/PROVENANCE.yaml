note: >-
  Copy of the upstream skill directory (SKILL.md and the four prompt and
  rubric files under references/) at the pinned commit (2026-04-14),
  adapted from a Cursor plugin to Claude Code; scripts/diff-upstream.sh how
  shows every local change. Answers "how does X work" questions with an
  onboarding-level architectural explanation in five sections (Overview,
  Key Concepts, How It Works, Where Things Live, Gotchas). Simple questions
  go to one explainer subagent; complex ones fan out to 2 to 4 read-only
  explorers, then one synthesizer. Critique mode explains first, then runs
  three independent critics against a rubric and ends on a lead judgment
  (act on, consider, noted, dismissed). Read in full on 2026-11-20 before
  forking.
